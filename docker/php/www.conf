; PHP-FPM pool configuration for production
; Listen on all interfaces so nginx in web container can connect

[www]
user = www-data
group = www-data

; Listen on all interfaces (0.0.0.0) so nginx in other containers can connect
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process manager
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Logging
access.log = /proc/self/fd/1
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120
php_admin_value[post_max_size] = 25M
php_admin_value[upload_max_filesize] = 25M

; OPcache
; opcache settings belong in php.ini, not here
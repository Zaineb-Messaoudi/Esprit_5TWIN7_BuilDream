name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  APP_ENV: testing
  APP_DEBUG: false
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: solarshare_test
  DB_USERNAME: root
  DB_PASSWORD: password
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array
  SCOUT_DRIVER: 'null'
  AI_ENABLED: false
  BROADCAST_DRIVER: log

jobs:
  frontend-tests:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Lint CSS/JS
        run: npx eslint resources/js --ext .js,.vue 2>/dev/null || true

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            public/build
            public/fonts
          key: build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.js') }}
          restore-keys: |
            build-${{ runner.os }}-

  php-tests:
    name: PHP Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: frontend-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: solarshare_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      matrix:
        php-version: ['8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore build artifacts
        uses: actions/cache@v4
        with:
          path: |
            public/build
            public/fonts
          key: build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.js') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, curl, mbstring, zip, pcntl, redis, gd, openssl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies (skip scripts)
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader --no-scripts

      - name: Copy .env.testing
        run: cp .env.testing .env 2>/dev/null || cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate --no-interaction

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/60)"
            sleep 2
          done
          # Verify database exists
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e "USE solarshare_test; SHOW TABLES;"

      - name: Run package discovery
        run: php artisan package:discover --ansi

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Run PHP tests (Pest)
        run: php artisan test --parallel

      - name: Run static analysis (Pint)
        run: vendor/bin/pint --test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Check code style
        run: vendor/bin/pint --test --parallel

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Install NPM dependencies
        run: npm ci

      - name: Composer audit (non-blocking)
        run: composer audit --no-interaction || true

      - name: NPM audit (non-blocking)
        run: npm audit --audit-level=high 2>/dev/null || true

  notify:
    name: Notify on Failure
    needs: [php-tests, frontend-tests, lint, security]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "::notice ::GitHub Actions workflow failed - check the Actions tab"
        shell: bash
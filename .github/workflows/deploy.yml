name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io

concurrency:
  group: solarshare-production
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  docker-build:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Docker Hub image name
        id: docker-image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$username"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/$username/solarshare" >> "$GITHUB_OUTPUT"
          echo "web-image=docker.io/$username/solarshare-nginx" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.docker-image.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker-image.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push staging image with seeders
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: COMPOSER_WITH_DEV=true
          tags: docker.io/${{ steps.docker-image.outputs.username }}/solarshare:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Nginx image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker-image.outputs.web-image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Laravel image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.docker-image.outputs.image }}:${{ steps.docker-image.outputs.tag }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Nginx image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.docker-image.outputs.web-image }}:${{ steps.docker-image.outputs.tag }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  staging-smoke:
    name: Staging smoke test
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout deployment definition
        uses: actions/checkout@v4

      - name: Normalize Docker Hub image name
        id: docker-image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$username"
          echo "image=docker.io/$username/solarshare:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "staging-image=docker.io/$username/solarshare:staging-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "web-image=docker.io/$username/solarshare-nginx:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create isolated staging environment
        run: |
          staging_app_key="base64:$(openssl rand -base64 32 | tr -d '\n')"

          cat > .env <<'EOF'
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:18000
          APP_PORT=18000
          DB_DATABASE=SolarShare
          DB_USERNAME=root
          DB_PASSWORD=solarshare
          FORWARD_DB_PORT=13306
          FORWARD_REDIS_PORT=16379
          FORWARD_MEILISEARCH_PORT=17700
          FORWARD_MAILPIT_PORT=11025
          FORWARD_MAILPIT_DASHBOARD_PORT=18025
          REVERB_PORT=18081
          MEILISEARCH_KEY=staging-master-key
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          SCOUT_DRIVER=null
          BROADCAST_CONNECTION=log
          REVERB_APP_ID=staging
          REVERB_APP_KEY=staging-key
          REVERB_APP_SECRET=staging-secret
          REVERB_HOST=localhost
          REVERB_SCHEME=http
          VITE_REVERB_APP_KEY=staging-key
          VITE_REVERB_HOST=localhost
          VITE_REVERB_PORT=18081
          VITE_REVERB_SCHEME=http
          EOF

          printf 'APP_KEY=%s\n' "$staging_app_key" >> .env

      - name: Start staging stack from the published image
        env:
          APP_IMAGE: ${{ steps.docker-image.outputs.staging-image }}
          WEB_IMAGE: ${{ steps.docker-image.outputs.web-image }}
        run: docker compose -p solarshare-staging up -d --no-build --remove-orphans

      - name: Wait for MySQL to be ready
        env:
          DB_PASSWORD: solarshare
        run: |
          for i in {1..30}; do
            if docker compose -p solarshare-staging exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -p"${DB_PASSWORD}" --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Run Laravel bootstrap (migrations, cache)
        run: |
          docker compose -p solarshare-staging exec -T app php artisan config:clear
          docker compose -p solarshare-staging exec -T app php artisan route:clear
          docker compose -p solarshare-staging exec -T app php artisan view:clear
          docker compose -p solarshare-staging exec -T app php artisan migrate --force
          docker compose -p solarshare-staging exec -T app php artisan db:seed --force
          docker compose -p solarshare-staging exec -T app php artisan config:cache
          docker compose -p solarshare-staging exec -T app php artisan route:cache
          docker compose -p solarshare-staging exec -T app php artisan view:cache
          docker compose -p solarshare-staging exec -T app php artisan storage:link

      - name: Wait for staging health endpoint
        run: curl --fail --retry 30 --retry-delay 5 http://127.0.0.1:18000/up

      - name: Diagnose staging failure
        if: failure()
        run: |
          echo '--- HTTP response ---'
          curl --silent --show-error --include http://127.0.0.1:18000/up || true
          echo '--- Docker service status ---'
          docker compose -p solarshare-staging ps
          echo '--- Application and Nginx logs ---'
          docker compose -p solarshare-staging logs --no-color --tail=200 app web

      - name: Show staging services
        if: always()
        run: docker compose -p solarshare-staging ps

      - name: Tear down staging
        if: always()
        run: docker compose -p solarshare-staging down -v --remove-orphans

  deploy-production:
    name: Deploy to Production
    needs: staging-smoke
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    environment: production
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4

      - name: Deploy production automatically on WSL
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./scripts/deploy/local-compose.sh production "sha-$GITHUB_SHA"

name: Deploy Production

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
    deploy_remote:
      description: 'Deploy to a configured remote Docker host'
      required: true
      default: false
      type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/solarshare

jobs:
  build-and-test:
    name: Build & Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  docker-build:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.deploy_remote) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_STAGING_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate staging deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_PATH"
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy staging image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/solarshare:sha-${GITHUB_SHA:0:7}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd '$DEPLOY_PATH'; APP_IMAGE='$IMAGE' docker compose pull; APP_IMAGE='$IMAGE' docker compose up -d --no-build; APP_IMAGE='$IMAGE' docker compose exec -T app php artisan migrate --force; APP_IMAGE='$IMAGE' docker compose ps; curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/up"

  deploy-production:
    name: Deploy to Production
    needs: docker-build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.deploy_remote) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_PRODUCTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate production deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_PATH"
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy production image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/solarshare:sha-${GITHUB_SHA:0:7}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd '$DEPLOY_PATH'; APP_IMAGE='$IMAGE' docker compose pull; APP_IMAGE='$IMAGE' docker compose up -d --no-build; APP_IMAGE='$IMAGE' docker compose exec -T app php artisan migrate --force; APP_IMAGE='$IMAGE' docker compose ps; curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/up"

  notify-success:
    name: Notify Success
    needs: [deploy-staging, deploy-production]
    if: success() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Send success notification
        run: |
          echo "::notice ::Deployment successful!"

name: Deploy Production

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

env:
  REGISTRY: docker.io

jobs:
  build-and-test:
    name: Build & Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  docker-build:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Docker Hub image name
        id: docker-image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$username"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/$username/solarshare" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.docker-image.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker-image.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, linux, x64]
    environment: staging
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4

      - name: Deploy staging automatically on WSL
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./scripts/deploy/local-compose.sh staging "sha-$GITHUB_SHA"

  deploy-production:
    name: Deploy to Production
    needs: docker-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64]
    environment: production
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4

      - name: Deploy production automatically on WSL
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./scripts/deploy/local-compose.sh production "sha-$GITHUB_SHA"

  notify-success:
    name: Notify Success
    needs: [deploy-staging, deploy-production]
    if: success() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Send success notification
        run: |
          echo "::notice ::Deployment successful!"
